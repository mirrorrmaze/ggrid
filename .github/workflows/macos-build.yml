name: Build macOS plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal binary - arm64 + x86_64)
        run: >
          cmake -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build VST3 + Standalone (Release)
        run: cmake --build build --config Release --target GGrid_VST3 GGrid_Standalone -j 4

      # Zipped artifact only for now -- no code-signed/notarized .pkg installer yet (that's a
      # later pass; see MultibandConvolver's Installer/macos + macos-build.yml for the pattern
      # to follow once GGrid has an Installer/ folder of its own). Until then, the factory IR
      # library ships as a plain IRs/ folder alongside the plugin in the zip -- Convolution
      # won't find any IRs until it's copied to ~/Documents/GGrid/IRs (see
      # IRLibrary::resolveIRRoot()'s fallback order), same as the Windows installer's
      # {userdocs}\GGrid\IRs step, just manual until there's a signed macOS installer.
      - name: Zip build output
        run: |
          set -e
          mkdir -p dist
          cp -R "build/GGrid_artefacts/Release/VST3/GGrid.vst3" dist/
          cp -R "build/GGrid_artefacts/Release/Standalone/GGrid.app" dist/
          cp -R "Resources/IRs" dist/IRs
          ditto -c -k --sequesterRsrc --keepParent dist "GGrid-macOS.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGrid-macOS
          path: "GGrid-macOS.zip"
